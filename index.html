<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Динамические параграфы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        p {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
        }
        input {
            width: 300px;
            padding: 8px;
            margin: 10px 0;
        }
        button {
            padding: 8px 16px;
        }
        button.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="paragraphs">
        <p>Первый параграф</p>
        <p>Второй параграф</p>
        <p>Третий параграф</p>
    </div>
    
    <input type="text" id="textInput" placeholder="Введите текст">
    <button id="addButton" class="hidden">Добавить</button>

    <script>
        const textInput = document.getElementById('textInput');
        const addButton = document.getElementById('addButton');
        const paragraphsContainer = document.getElementById('paragraphs');
        
        // Обновление состояния кнопки
        textInput.addEventListener('input', function() {
            if (textInput.value.trim() === '') {
                addButton.classList.add('hidden');
            } else {
                addButton.classList.remove('hidden');
            }
        });
        
        // Добавление нового параграфа
        addButton.addEventListener('click', function() {
            const text = textInput.value.trim();
            if (text === '') return;
            
            // Создаем новый параграф
            const newParagraph = document.createElement('p');
            newParagraph.textContent = text;
            
            // Добавляем в конец контейнера
            paragraphsContainer.appendChild(newParagraph);
            
            // Если параграфов больше 3, удаляем первый
            const paragraphs = paragraphsContainer.querySelectorAll('p');
            if (paragraphs.length > 3) {
                paragraphsContainer.removeChild(paragraphs[0]);
            }
            
            // Очищаем поле ввода и скрываем кнопку
            textInput.value = '';
            addButton.classList.add('hidden');
        });
        
        // Добавление по нажатию Enter
        textInput.addEventListener('keyup', function(event) {
            if (event.key === 'Enter' && !addButton.classList.contains('hidden')) {
                addButton.click();
            }
        });
    </script>
</body>
</html>
